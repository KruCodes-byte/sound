<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Soundboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 700px;
            margin: auto;
        }
        
        .sound-btn {
            background: #ff9800;
            border: none;
            border-radius: 12px;
            padding: 25px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .sound-btn:hover {
            background: #fb8c00;
            transform: scale(1.05);
        }
        
        .sound-btn span {
            display: block;
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>🎵 SOUND BOARD</h1>

    <div class="board">
        <button class="sound-btn" onclick="play('laugh')">😂<span>ตลกตบมุก</span></button>
        <button class="sound-btn" onclick="play('wow')">😮<span>ตึงโป๊ะๆ</span></button>
        <button class="sound-btn" onclick="play('error')">😁<span>จะรออะไร</span></button>
        <button class="sound-btn" onclick="play('success')">🤔<span>งง</span></button>
        <button class="sound-btn" onclick="play('clap')">❤️<span>roman</span></button>
        <button class="sound-btn" onclick="play('drum')">🎶<span>เพลงคุณธรรม</span></button>
        <button class="sound-btn" onclick="play('a')">🤩<span>เปิดตัวตลกคาเฟ่</span></button>
        <button class="sound-btn" onclick="play('f')">😶<span>ฉันมาทำอะไรที่นี่</span></button>
    </div>

    <!-- เสียง -->
    <audio id="laugh" src="2-tlktbmuk-2.mp3"></audio>
    <audio id="wow" src="tuengopa_s6yIrpV.mp3"></audio>
    <audio id="error" src="untitled_cBdlljd.mp3"></audio>
    <audio id="success" src="ngng.mp3"></audio>
    <audio id="clap" src="romanceeeeeeeeeeeeee.mp3"></audio>
    <audio id="drum" src="ephlngkhunthrrm_drsRjnP.mp3"></audio>
    <audio id="a" src="7-epidtawtlkkhaaef.mp3"></audio>
    <audio id="f" src="m_fixed_SA0dUiR.mp3"></audio>


    <script>
        function play(id) {
            const sound = document.getElementById(id);
            sound.currentTime = 0;
            sound.play();
        }
    </script>

</body>


</html>
